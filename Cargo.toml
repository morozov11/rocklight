[package]
name = "rocklight"
version = "0.1.0"
edition = "2021"

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
tray-icon = "0.19"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
